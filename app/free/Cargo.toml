[package]
name = "hyper-free"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Unit-test modules live in tests/ and are included by their owning library.
autotests = false

[[bin]]
name = "hyper-free"
path = "src/main.rs"
test = false
bench = false

[dependencies]
clap.workspace = true
hyper-os.workspace = true
hyper-rt.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "hyper")'.dependencies]
hyper-clap-shared.workspace = true
hyper-tool-args-shared.workspace = true

[target.'cfg(not(target_os = "hyper"))'.dependencies]
hyper-tool-args.workspace = true
