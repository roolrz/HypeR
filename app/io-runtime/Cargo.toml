[package]
name = "hyper-io-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Test modules are included by their production library owners.
autotests = false

[[bin]]
name = "hyper-io-runtime"
path = "src/main.rs"
test = false
bench = false

[features]
storage-probe = []
broker-test = []
userspace-device-test = []

[[bin]]
name = "hyper-storage-probe"
path = "tests/fixtures/storage_probe.rs"
required-features = ["storage-probe"]
test = false
bench = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
hyper-os = { workspace = true, features = ["std"] }
hyper-rt.workspace = true
hyper-service.workspace = true
hyper-vm-image.workspace = true
hyper-vm-runtime = { path = "../vm-runtime" }

[lints]
workspace = true
