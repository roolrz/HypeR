[package]
name = "hyper-init"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/roolrz/HypeR"
publish = false

[[bin]]
name = "hyper-init"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hyper-os = "=0.0.0"
hyper-rt = "=0.0.0"

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
debug = 1
incremental = false
lto = "thin"
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = "none"
