name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check formatting and lints
        run: |
          make check
          make check ARCH=riscv64
          make check ARCH=x86_64
          cargo fmt --all -- --check
          cargo fmt --manifest-path tests/host/Cargo.toml -- --check
          cargo fmt --manifest-path tools/kconfig/Cargo.toml -- --check
          cargo fmt --manifest-path tools/kallsyms/Cargo.toml -- --check

  test:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run host and configuration tests
        run: make test

  build:
    name: Build canonical kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build and verify stripped delivery copy
        run: |
          make release ARCH=aarch64
          make release ARCH=riscv64
          make release ARCH=x86_64
      - name: Upload canonical and stripped artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyper-kernels
          path: |
            target/aarch64-unknown-none/kernel/hyper
            target/aarch64-unknown-none/kernel/hyper.img
            target/aarch64-unknown-none/kernel/hyper.kallsyms
            target/aarch64-unknown-none/kernel/hyper.stripped
            target/aarch64-unknown-none/kernel/hyper.stripped.img
            target/riscv64imac-unknown-none-elf/kernel/hyper
            target/riscv64imac-unknown-none-elf/kernel/hyper.img
            target/riscv64imac-unknown-none-elf/kernel/hyper.kallsyms
            target/riscv64imac-unknown-none-elf/kernel/hyper.stripped
            target/riscv64imac-unknown-none-elf/kernel/hyper.stripped.img
            target/x86_64-unknown-none/kernel/hyper
            target/x86_64-unknown-none/kernel/hyper.img
            target/x86_64-unknown-none/kernel/hyper.kallsyms
            target/x86_64-unknown-none/kernel/hyper.stripped
            target/x86_64-unknown-none/kernel/hyper.stripped.img
          if-no-files-found: error

  image-test:
    name: Image tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Download kernel image
        uses: actions/download-artifact@v4
        with:
          name: hyper-kernels
          path: target
      - name: Verify image ABI and atomic backends
        run: |
          make test-image ARCH=aarch64
          make test-image ARCH=riscv64
          make test-image ARCH=x86_64

  qemu-boot:
    name: Four-core QEMU (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, build, image-test]
    strategy:
      fail-fast: false
      matrix:
        cpu: [cortex-a72, max]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cpio qemu-system-arm
      - name: Verify host SMP and Linux guest init
        run: make test-qemu QEMU_CPU=${{ matrix.cpu }}
      - name: Clean up QEMU processes
        if: always()
        run: |
          pkill -TERM -x qemu-system-aarch64 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            if ! pgrep -x qemu-system-aarch64 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          pkill -KILL -x qemu-system-aarch64 2>/dev/null || true

  qemu-riscv64:
    name: Four-hart QEMU RISC-V
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cpio qemu-system-misc
      - name: Verify RISC-V host SMP and Linux guest init
        run: make test-qemu ARCH=riscv64 QEMU_CPU=rv64
      - name: Clean up QEMU processes
        if: always()
        run: |
          pkill -TERM -x qemu-system-riscv64 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            if ! pgrep -x qemu-system-riscv64 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          pkill -KILL -x qemu-system-riscv64 2>/dev/null || true

  qemu-x86-64:
    name: Four-core QEMU x86-64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install QEMU and DT compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cpio device-tree-compiler qemu-system-x86
      - name: Verify x86-64 host SMP and Linux guest init
        run: |
          sudo chmod 666 /dev/kvm
          QEMU_ACCEL=kvm make test-qemu ARCH=x86_64 QEMU_CPU=host,+invtsc
      - name: Clean up QEMU processes
        if: always()
        run: |
          pkill -TERM -x qemu-system-x86_64 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            if ! pgrep -x qemu-system-x86_64 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          pkill -KILL -x qemu-system-x86_64 2>/dev/null || true
