# Merged with the normal target rustflags only for STACK_METADATA=1 builds.
# .stack_sizes is non-allocated ELF metadata, absent from the boot image.
[target.aarch64-unknown-none]
rustflags = ["-Zemit-stack-sizes"]

[target.riscv64imac-unknown-none-elf]
rustflags = ["-Zemit-stack-sizes"]

[target.x86_64-unknown-none]
rustflags = ["-Zemit-stack-sizes"]
